# ===== Misr Assistant Backend — Fly.io Configuration =====
app = "misr-assistant-api"
primary_region = "cdg"   # Paris

[build]
  dockerfile = "Dockerfile"

[env]
  APP_NAME = "Misr Assistant API"
  APP_VERSION = "0.1.0"
  APP_ENV = "production"
  DEBUG = "false"
  API_V1_PREFIX = "/api/v1"
  GEMINI_MODEL = "gemini-3.6-flash"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1